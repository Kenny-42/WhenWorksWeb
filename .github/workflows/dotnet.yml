# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore
      run: dotnet restore WhenWorksWeb/WhenWorksWeb.csproj
      
    - name: Build
      run: dotnet build WhenWorksWeb/WhenWorksWeb.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test WhenWorksWeb/WhenWorksWeb.csproj --configuration Release --no-build --verbosity normal
