# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore
      run: dotnet restore tests/dotnet-unit/WhenWorksWeb.Tests/WhenWorksWeb.Tests.csproj

    - name: Build
      run: dotnet build tests/dotnet-unit/WhenWorksWeb.Tests/WhenWorksWeb.Tests.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test tests/dotnet-unit/WhenWorksWeb.Tests/WhenWorksWeb.Tests.csproj --configuration Release --no-build --verbosity normal
      env:
        # Program.cs reads and validates Brevo:ApiKey as top-level startup code, before
        # CustomWebApplicationFactory's ConfigureWebHost override (which swaps IEmailSender for
        # TestEmailSender) ever gets a chance to run -- so every test that boots the app via
        # WebApplicationFactory needs SOME value here just to get past that check, real or not.
        # This never reaches Brevo's API: TestEmailSender still replaces IEmailSender before any
        # HTTP call would be made. Locally this is satisfied by a real key in user secrets instead.
        Brevo__ApiKey: test-placeholder-not-a-real-key
